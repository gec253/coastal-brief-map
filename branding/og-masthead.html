<!DOCTYPE html>
<!--
  Reproducible 1200×630 Open Graph source for branding/og-masthead.jpg.
  Render: node branding/render-og-masthead.js

  Type: Fraunces and Source Sans 3, SIL Open Font License 1.1 (see /fonts).
  Texture: NOAA Chart 11545, Beaufort Inlet and Part of Core Sound; Lookout Bight,
  2023 final raster (11545-8-2023), public domain / CC0. Not for navigation.
  A separate higher-resolution Lookout Bight crop (branding/og-masthead-chart.webp,
  2400×1260) is smoothed and contrast-crushed so it reads as a faint texture;
  the 13.2 KB site masthead webp is not used here. Credit: docs/IDENTITY.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Coastal Brief — Open Graph masthead (1200×630)</title>
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("../fonts/fraunces-var.woff2") format("woff2");
    font-weight: 500 600;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Fraunces";
    src: url("../fonts/fraunces-italic-var.woff2") format("woff2");
    font-weight: 500;
    font-style: italic;
    font-display: block;
  }
  @font-face {
    font-family: "Source Sans 3";
    src: url("../fonts/source-sans-3-var.woff2") format("woff2");
    font-weight: 400 700;
    font-style: normal;
    font-display: block;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #071C29;
  }
  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background: #071C29;
    color: #F3E6D0;
  }
  .texture {
    position: absolute;
    inset: 0;
    background: url("og-masthead-chart.webp") center / cover no-repeat;
    opacity: 0.85;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  /* Centered safe area: remains intact in a 1.91:1 crop and a centered square crop. */
  .safe {
    position: absolute;
    left: 285px;
    width: 630px;
    top: 0;
    height: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 1;
    box-sizing: border-box;
    padding: 48px 24px;
  }
  .kicker {
    margin: 0 0 18px;
    font-family: "Source Sans 3", "Palatino Linotype", serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #D4C6AE;
  }
  .rule {
    width: 420px;
    max-width: 80%;
    height: 0;
    border-top: 2px solid #C4A36A;
    border-bottom: 1px solid #C4A36A;
    padding-bottom: 3px;
  }
  h1 {
    margin: 22px 0 20px;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 100px;
    line-height: 0.92;
    letter-spacing: -0.03em;
    font-variation-settings: "opsz" 144, "SOFT" 18, "WONK" 0.35;
    color: #F3E6D0;
  }
  h1 span { display: block; }
  h1 .line-1 { font-size: 0.58em; letter-spacing: 0.06em; margin-bottom: 0.1em; text-transform: uppercase; }
  h1 .line-2 { letter-spacing: 0.02em; text-transform: uppercase; }
  .mission {
    margin: 22px 0 0;
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: 0;
    color: #D4C6AE;
    max-width: 540px;
  }
</style>
</head>
<body>
  <div class="card" id="og-card">
    <div class="texture" aria-hidden="true"></div>
    <div class="safe">
      <p class="kicker">North Carolina</p>
      <div class="rule" aria-hidden="true"></div>
      <h1>
        <span class="line-1">THE COASTAL</span>
        <span class="line-2">BRIEF</span>
      </h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="mission">From the rivers to the sounds to the sea</p>
    </div>
  </div>
</body>
</html>
